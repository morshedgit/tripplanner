name = "tripplanner"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-11-16"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = "./dist/client"

[[d1_databases]]
binding = "DB"
database_name = "tripplanner-db"
database_id = "tripplanner-db-local"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "tripplanner-kv-local"

[[kv_namespaces]]
binding = "SESSION"
id = "tripplanner-session-local"
